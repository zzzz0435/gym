<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健身紀錄">
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>健身紀錄</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;
  --accent:#ff6a3d;--accent-ink:#fff;--ok:#16a34a;--danger:#dc2626;--input:#f1f2f4;
  --chip-l:45%;--chip-a:.14;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;--card:#1a1d23;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e36;
    --accent:#ff7a50;--input:#23272f;--chip-l:68%;--chip-a:.2;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#1a1d23;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e36;
  --accent:#ff7a50;--input:#23272f;--chip-l:68%;--chip-a:.2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px);
  max-width:640px;margin:0 auto;
}
h1{font-size:26px;margin:8px 0 14px;letter-spacing:-.02em}
h2{font-size:17px;margin:22px 0 8px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;border:1px solid var(--line)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--input);font-weight:600;text-align:center;margin:8px 0}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;margin:0;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
input,select,textarea{
  font:inherit;font-size:16px;color:var(--text);background:var(--input);
  border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:hsl(var(--h) 80% 50% / var(--chip-a));color:hsl(var(--h) 70% var(--chip-l));white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip-btn{padding:6px 12px;border-radius:99px;background:var(--input);font-size:14px}
.chip-btn.on{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--input)}
.ex-name{font-weight:700;font-size:17px}
.last{font-size:13px;color:var(--muted);margin:4px 0 8px}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:12px;color:var(--muted);font-weight:500;text-align:center;padding-bottom:4px}
.sets td{padding:3px 3px;text-align:center}
.sets td:first-child{width:30px;color:var(--muted);font-weight:600}
.sets input{text-align:center;padding:9px 4px}
.sets tr.done input{background:hsl(142 70% 45% / .15)}
.check{width:38px;height:38px;border-radius:10px;background:var(--input);color:var(--muted);font-weight:700}
tr.done .check{background:var(--ok);color:#fff}
.del-set{color:var(--muted);width:28px}
.add-set{width:100%;padding:9px;margin-top:6px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.hist-ex{font-size:14px;margin:3px 0}
.hist-ex b{font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--accent)}
svg text{fill:var(--muted);font-size:10px}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* modal sheet */
#modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;border-radius:20px 20px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column}
#plist{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.pick{display:flex;width:100%;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.pick.added span:first-child::after{content:" ✓";color:var(--ok);font-weight:700}
.newex{background:var(--card);border-radius:12px;padding:10px;margin:6px 0;font-size:14px}
/* rest timer + toast */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);
  background:var(--text);color:var(--bg);border-radius:99px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;z-index:15;
  font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
#rest[hidden]{display:none}
#rest button{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:99px;padding:5px 10px;font-size:13px}
#rest.over{background:var(--ok);color:#fff}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
</style>
</head>
<body>
<main id="view"></main>
<div id="modal" hidden></div>
<div id="rest" hidden></div>
<div id="toast"></div>
<nav id="tabs"></nav>

<script>
"use strict";
const KEY = 'gymlog.v1';
const PARTS = ['胸','背','腿','肩','手臂','核心','有氧','其他'];
const HUE = {胸:5,背:210,腿:140,肩:35,手臂:275,核心:190,有氧:330,其他:0};
const DEFAULT_EX = {
  胸:['槓鈴臥推','啞鈴臥推','上斜啞鈴臥推','機械胸推','蝴蝶機夾胸','雙槓撐體'],
  背:['硬舉','引體向上','滑輪下拉','槓鈴划船','坐姿划船','單臂啞鈴划船'],
  腿:['槓鈴深蹲','腿推機','羅馬尼亞硬舉','腿伸展','腿彎舉','保加利亞分腿蹲','臀推','提踵'],
  肩:['槓鈴肩推','啞鈴肩推','側平舉','反向飛鳥','臉拉'],
  手臂:['槓鈴彎舉','啞鈴彎舉','錘式彎舉','三頭下壓','過頭三頭伸展'],
  核心:['棒式','捲腹','懸垂舉腿'],
  有氧:['跑步機','飛輪','划船機']
};
let _c = 0;
const uid = () => Date.now().toString(36) + (_c++).toString(36) + Math.random().toString(36).slice(2,6);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate()-n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return `${m}/${d}（${'日一二三四五六'[new Date(y,m-1,d).getDay()]}）`; };
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const hasVal = s => String(s.w ?? '').trim() !== '' || String(s.r ?? '').trim() !== '';
const fmtSet = s => String(s.w ?? '').trim() !== '' ? `${num(s.w)}×${s.r || '?'}` : `${s.r || '?'}次`;

/* ---------- 資料 ---------- */
function seed(){
  const exercises = [];
  for (const p in DEFAULT_EX) for (const n of DEFAULT_EX[p]) exercises.push({id:uid(), name:n, part:p});
  const byName = n => exercises.find(x => x.name === n).id;
  const routines = [
    {id:uid(), name:'推日（胸・肩・三頭）', items:['槓鈴臥推','上斜啞鈴臥推','啞鈴肩推','側平舉','三頭下壓'].map(byName)},
    {id:uid(), name:'拉日（背・二頭）', items:['引體向上','槓鈴划船','滑輪下拉','臉拉','啞鈴彎舉'].map(byName)},
    {id:uid(), name:'腿日', items:['槓鈴深蹲','羅馬尼亞硬舉','腿推機','腿彎舉','提踵'].map(byName)}
  ];
  return {exercises, routines, workouts:[], active:null, settings:{rest:90}};
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.exercises)) { s.settings ??= {rest:90}; return s; } } catch(e){}
  return seed();
}
let S = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠️ 儲存失敗，請先匯出備份'); }
}
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const ui = { tab:'train', picker:null, editRoutine:null, progressEx:null, openHist:null, rest:null };
const exOf = id => S.exercises.find(x => x.id === id) || {id, name:'（已刪除的動作）', part:'其他'};
const chip = p => `<span class="chip" style="--h:${HUE[p] ?? 0}">${esc(p)}</span>`;
const sortedW = () => [...S.workouts].sort((a,b) => b.date.localeCompare(a.date) || b.start - a.start);
const activeW = () => S.workouts.find(w => w.id === S.active);

function lastFor(exId, cur){
  for (const w of sortedW()) {
    if (cur && (w.id === cur.id || w.date > cur.date)) continue;
    const e = w.entries.find(e => e.exId === exId && e.sets.some(hasVal));
    if (e) return {date:w.date, sets:e.sets.filter(hasVal)};
  }
  return null;
}
function newEntry(exId, w){
  const l = lastFor(exId, w);
  const sets = l ? l.sets.map(s => ({w:s.w, r:s.r, done:false})) : [0,1,2].map(() => ({w:'', r:'', done:false}));
  return {exId, sets};
}
function partsOf(w){ return [...new Set(w.entries.map(e => exOf(e.exId).part))]; }
function volumeOf(w){ let v = 0; for (const e of w.entries) for (const s of e.sets) v += num(s.w) * num(s.r); return v; }

/* ---------- 畫面 ---------- */
const ICONS = {
  train:'<path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/>',
  routine:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  progress:'<path d="M3 20h18M6 16l4-5 3 3 5-7"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const TABS = [['train','訓練'],['routine','菜單'],['history','紀錄'],['progress','進度'],['settings','設定']];

function render(){
  $('#tabs').innerHTML = TABS.map(([k,l]) =>
    `<button class="${ui.tab===k?'on':''}" data-act="tab" data-t="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join('');
  const v = {train:viewTrain, routine:viewRoutine, history:viewHistory, progress:viewProgress, settings:viewSettings}[ui.tab];
  $('#view').innerHTML = v();
  renderModal();
  renderRest();
}

/* 訓練 */
function viewTrain(){
  const w = activeW();
  if (!w) return trainHome();
  return `
  <div class="row between"><h1>訓練中 💪</h1><span class="muted">${w.entries.length} 個動作</span></div>
  <div class="row"><span class="muted" style="white-space:nowrap">日期</span><input type="date" value="${w.date}" data-bind="wdate"></div>
  ${w.entries.map((e,i) => entryCard(e,i,w)).join('') || '<div class="empty">還沒有動作，點下方按鈕新增</div>'}
  <button class="btn" data-act="addEx">＋ 新增動作</button>
  <h2>備註</h2>
  <textarea data-bind="note" placeholder="今天狀況、感受…">${esc(w.note || '')}</textarea>
  <button class="btn primary" data-act="finish">完成訓練</button>
  <button class="btn danger" data-act="discard">刪除這次訓練</button>`;
}
function entryCard(e, i, w){
  const x = exOf(e.exId), l = lastFor(e.exId, w);
  return `<div class="card">
    <div class="row">
      <div class="grow"><span class="ex-name">${esc(x.name)}</span> ${chip(x.part)}</div>
      ${i>0 ? `<button class="icon-btn" data-act="upEntry" data-e="${i}" aria-label="上移">↑</button>` : ''}
      <button class="icon-btn" data-act="delEntry" data-e="${i}" aria-label="移除">✕</button>
    </div>
    <div class="last">${l ? `上次 ${fmtDate(l.date)}：${l.sets.map(fmtSet).join(' · ')}` : '第一次做這個動作'}</div>
    <table class="sets"><thead><tr><th>組</th><th>公斤</th><th>次數</th><th></th><th></th></tr></thead><tbody>
    ${e.sets.map((s,j) => `<tr class="${s.done?'done':''}">
      <td>${j+1}</td>
      <td><input inputmode="decimal" data-f="w" data-e="${i}" data-s="${j}" value="${esc(s.w)}" placeholder="-"></td>
      <td><input inputmode="numeric" data-f="r" data-e="${i}" data-s="${j}" value="${esc(s.r)}" placeholder="-"></td>
      <td><button class="check" data-act="done" data-e="${i}" data-s="${j}" aria-label="完成這組">✓</button></td>
      <td><button class="del-set" data-act="delSet" data-e="${i}" data-s="${j}" aria-label="刪除這組">✕</button></td>
    </tr>`).join('')}
    </tbody></table>
    <button class="add-set" data-act="addSet" data-e="${i}">＋ 加一組</button>
  </div>`;
}
function trainHome(){
  const week = S.workouts.filter(w => w.date >= daysAgo(6));
  const partCount = {};
  for (const w of week) for (const p of partsOf(w)) partCount[p] = (partCount[p]||0) + 1;
  const last = sortedW()[0];
  return `
  <h1>今天練什麼？</h1>
  <div class="stat-grid">
    <div class="stat"><b>${week.length}</b><span>近 7 天訓練</span></div>
    <div class="stat"><b>${S.workouts.length}</b><span>總訓練次數</span></div>
    <div class="stat"><b>${last ? fmtDate(last.date).split('（')[0] : '-'}</b><span>上次訓練</span></div>
  </div>
  ${Object.keys(partCount).length ? `<div class="card"><div class="muted">近 7 天練過的部位</div><div class="chips">${
    PARTS.filter(p => partCount[p]).map(p => `${chip(p)}<span class="muted" style="margin:0 6px 0 -2px">×${partCount[p]}</span>`).join('')}</div>
    ${(() => { const miss = ['胸','背','腿','肩'].filter(p => !partCount[p]); return miss.length ? `<div class="muted">還沒練：${miss.join('、')}</div>` : ''; })()}
  </div>` : ''}
  <h2>從菜單開始</h2>
  ${S.routines.map(r => `<button class="card list-item" style="width:100%;text-align:left" data-act="start" data-id="${r.id}">
      <div class="grow"><div class="ex-name">${esc(r.name)}</div>
      <div class="chips" style="margin:4px 0 0">${[...new Set(r.items.map(id => exOf(id).part))].map(chip).join('')}</div></div>
      <span class="muted">${r.items.length} 動作 ›</span></button>`).join('') || '<p class="muted">還沒有菜單，到「菜單」建立一個吧</p>'}
  <button class="btn primary" data-act="start" data-id="">空白訓練（自己加動作）</button>`;
}

/* 菜單 */
function viewRoutine(){
  const r = ui.editRoutine;
  if (r) return `
    <h1>${r.id ? '編輯菜單' : '新菜單'}</h1>
    <input data-bind="rname" placeholder="菜單名稱，例如：胸日" value="${esc(r.name)}">
    <div class="card">
      ${r.items.map((id,i) => { const x = exOf(id); return `<div class="list-item">
        <div class="grow">${esc(x.name)} ${chip(x.part)}</div>
        ${i>0 ? `<button class="icon-btn" data-act="rUp" data-i="${i}">↑</button>` : ''}
        <button class="icon-btn" data-act="rDel" data-i="${i}">✕</button></div>`; }).join('') || '<div class="muted">尚未加入動作</div>'}
    </div>
    <button class="btn" data-act="rAdd">＋ 加入動作</button>
    <button class="btn primary" data-act="rSave">儲存菜單</button>
    ${r.id ? '<button class="btn danger" data-act="rRemove">刪除這個菜單</button>' : ''}
    <button class="btn" data-act="rCancel">取消</button>`;
  return `
    <h1>我的菜單</h1>
    ${S.routines.map(r => `<div class="card">
      <div class="row"><div class="grow ex-name">${esc(r.name)}</div><button class="btn sm" data-act="rEdit" data-id="${r.id}">編輯</button></div>
      <div class="muted" style="margin-top:6px">${r.items.map(id => esc(exOf(id).name)).join('、') || '（空）'}</div>
    </div>`).join('') || '<div class="empty">還沒有菜單</div>'}
    <button class="btn primary" data-act="rNew">＋ 建立新菜單</button>`;
}

/* 紀錄 */
function viewHistory(){
  const list = sortedW().filter(w => w.id !== S.active);
  if (!list.length) return '<h1>訓練紀錄</h1><div class="empty">還沒有紀錄，完成第一次訓練後會出現在這裡</div>';
  let month = '', html = '<h1>訓練紀錄</h1>';
  for (const w of list) {
    const m = w.date.slice(0,7);
    if (m !== month) { month = m; html += `<h2>${m.replace('-','年')}月</h2>`; }
    const open = ui.openHist === w.id;
    html += `<div class="card">
      <button class="row" style="width:100%;text-align:left" data-act="hToggle" data-id="${w.id}">
        <div class="grow"><b>${fmtDate(w.date)}</b> <span class="muted">· ${w.entries.length} 動作 · ${Math.round(volumeOf(w)).toLocaleString()} kg</span>
        <div class="chips" style="margin:4px 0 0">${partsOf(w).map(chip).join('')}</div></div>
        <span class="muted">${open ? '▾' : '▸'}</span>
      </button>
      ${open ? `<div style="margin-top:8px">
        ${w.entries.map(e => `<div class="hist-ex"><b>${esc(exOf(e.exId).name)}</b> <span class="muted">${e.sets.map(fmtSet).join(' · ')}</span></div>`).join('')}
        ${w.note ? `<p class="muted">📝 ${esc(w.note)}</p>` : ''}
        <div class="row" style="margin-top:8px"><button class="btn sm" data-act="hEdit" data-id="${w.id}">編輯</button>
        <button class="btn sm danger" data-act="hDel" data-id="${w.id}">刪除</button></div>
      </div>` : ''}
    </div>`;
  }
  return html;
}

/* 進度 */
function viewProgress(){
  const count = new Map();
  for (const w of S.workouts) for (const e of w.entries) if (e.sets.some(hasVal)) count.set(e.exId, (count.get(e.exId)||0) + 1);
  if (!count.size) return '<h1>進度</h1><div class="empty">記錄幾次訓練後，這裡會顯示重量進步曲線</div>';
  if (!count.has(ui.progressEx)) ui.progressEx = [...count.entries()].sort((a,b) => b[1]-a[1])[0][0];
  const exId = ui.progressEx, x = exOf(exId);
  const sessions = [...S.workouts].sort((a,b) => a.date.localeCompare(b.date) || a.start - b.start).flatMap(w => {
    const e = w.entries.find(e => e.exId === exId); if (!e) return [];
    const sets = e.sets.filter(hasVal); if (!sets.length) return [];
    const maxW = Math.max(...sets.map(s => num(s.w)));
    const e1 = Math.max(...sets.map(s => num(s.w) * (1 + num(s.r)/30)));
    const maxR = Math.max(...sets.map(s => num(s.r)));
    return [{date:w.date, sets, maxW, e1, maxR}];
  });
  const bodyweight = sessions.every(s => s.maxW === 0);
  const pr = Math.max(...sessions.map(s => bodyweight ? s.maxR : s.maxW));
  const best1 = Math.max(...sessions.map(s => s.e1));

  // 部位統計（近 30 天，以組數計）
  const partSets = {}; const since = daysAgo(29);
  for (const w of S.workouts) if (w.date >= since) for (const e of w.entries) {
    const p = exOf(e.exId).part; partSets[p] = (partSets[p]||0) + e.sets.filter(hasVal).length;
  }
  const maxPS = Math.max(1, ...Object.values(partSets));

  const opts = PARTS.map(p => {
    const xs = [...count.keys()].map(exOf).filter(x => x.part === p);
    return xs.length ? `<optgroup label="${p}">${xs.map(x => `<option value="${x.id}" ${x.id===exId?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>` : '';
  }).join('');

  return `
  <h1>進度</h1>
  <select data-bind="progressEx">${opts}</select>
  <div class="stat-grid" style="margin-top:10px">
    <div class="stat"><b>${pr}${bodyweight ? '' : '<small style="font-size:12px"> kg</small>'}</b><span>${bodyweight ? '最多次數' : '最大重量 PR'}</span></div>
    <div class="stat"><b>${bodyweight ? '-' : Math.round(best1)}</b><span>估計 1RM</span></div>
    <div class="stat"><b>${sessions.length}</b><span>做過次數</span></div>
  </div>
  <div class="card">
    <div class="muted">${esc(x.name)}・每次${bodyweight ? '最多次數' : '最大重量（kg）'}</div>
    ${chart(sessions.slice(-20).map(s => ({x:s.date, y: bodyweight ? s.maxR : s.maxW})))}
  </div>
  <div class="card">
    ${sessions.slice(-8).reverse().map(s => `<div class="hist-ex"><b>${fmtDate(s.date)}</b> <span class="muted">${s.sets.map(fmtSet).join(' · ')}</span></div>`).join('')}
  </div>
  <h2>近 30 天各部位組數</h2>
  <div class="card">
    ${PARTS.filter(p => partSets[p]).map(p => `<div class="row" style="margin:6px 0">
      <span style="width:42px;font-size:14px">${p}</span>
      <div class="grow"><div class="bar" style="width:${partSets[p]/maxPS*100}%;background:hsl(${HUE[p]} 75% 55%)"></div></div>
      <span class="muted" style="width:34px;text-align:right">${partSets[p]}</span></div>`).join('') || '<div class="muted">近 30 天沒有紀錄</div>'}
  </div>`;
}
function chart(pts){
  if (pts.length < 2) return '<p class="muted">至少要兩次紀錄才會出現趨勢圖</p>';
  const W = 340, H = 170, L = 34, R = 10, T = 12, B = 22;
  let mn = Math.min(...pts.map(p => p.y)), mx = Math.max(...pts.map(p => p.y));
  if (mn === mx) { mn -= 5; mx += 5; }
  const X = i => L + i * (W-L-R) / (pts.length-1);
  const Y = v => T + (mx - v) * (H-T-B) / (mx - mn);
  const grid = [mn, (mn+mx)/2, mx].map(v => `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>
    <text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${Math.round(v*10)/10}</text>`).join('');
  const line = pts.map((p,i) => `${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const short = d => d.slice(5).replace('-','/');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="重量趨勢圖">
    ${grid}
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.5" fill="var(--accent)"/>`).join('')}
    <text x="${L}" y="${H-4}">${short(pts[0].x)}</text>
    <text x="${W-R}" y="${H-4}" text-anchor="end">${short(pts[pts.length-1].x)}</text>
  </svg>`;
}

/* 設定 */
function viewSettings(){
  return `
  <h1>設定</h1>
  <div class="card">
    <div class="row between"><span>組間休息計時（秒）</span>
      <input style="width:90px;text-align:center" inputmode="numeric" data-bind="rest" value="${S.settings.rest}"></div>
    <div class="muted" style="margin-top:6px">按下 ✓ 完成一組後自動開始倒數，填 0 關閉</div>
  </div>
  <h2>資料備份</h2>
  <div class="card">
    <div class="muted">資料只存在這支手機的瀏覽器裡。建議每隔一段時間匯出備份。</div>
    <button class="btn" data-act="export">⬇︎ 匯出備份（JSON）</button>
    <label class="btn" style="cursor:pointer">⬆︎ 匯入備份<input type="file" accept=".json,application/json" id="importFile" hidden></label>
  </div>
  <h2>動作庫</h2>
  <button class="btn" data-act="addCustomEx">＋ 新增自訂動作</button>
  ${PARTS.map(p => { const xs = S.exercises.filter(x => x.part === p); return xs.length ? `<div class="card">
    <div style="margin-bottom:4px">${chip(p)}</div>
    ${xs.map(x => `<div class="list-item" style="padding:6px 0"><span class="grow">${esc(x.name)}</span>
      <button class="icon-btn" data-act="renameEx" data-id="${x.id}" aria-label="改名">✎</button>
      <button class="icon-btn" data-act="delEx" data-id="${x.id}" aria-label="刪除">✕</button></div>`).join('')}
  </div>` : ''; }).join('')}
  <button class="btn danger" data-act="reset">清除所有資料</button>`;
}

/* 動作選擇器 */
function openPicker(onPick, preAdded = []){
  ui.picker = {part:'全部', q:'', onPick, added:new Set(preAdded)};
  renderModal();
}
function renderModal(){
  const m = $('#modal');
  if (!ui.picker) { m.hidden = true; m.innerHTML = ''; return; }
  m.hidden = false;
  m.innerHTML = `<div class="sheet">
    <div class="row between" style="margin-bottom:8px"><b style="font-size:18px">選擇動作</b>
      <button class="btn sm primary" data-act="closePicker">完成</button></div>
    <input id="pq" placeholder="搜尋，或輸入新動作名稱" value="${esc(ui.picker.q)}" autocomplete="off">
    <div class="chips">${['全部', ...PARTS].map(p => `<button class="chip-btn ${p===ui.picker.part?'on':''}" data-act="pPart" data-p="${p}">${p}</button>`).join('')}</div>
    <div id="plist"></div></div>`;
  renderPickerList();
}
function renderPickerList(){
  const {part, q, added} = ui.picker, qq = q.trim();
  const list = S.exercises.filter(x => (part === '全部' || x.part === part) && (!qq || x.name.toLowerCase().includes(qq.toLowerCase())));
  let html = '';
  if (qq && !S.exercises.some(x => x.name === qq))
    html += `<div class="newex">新增「<b>${esc(qq)}</b>」到部位：<div class="chips">${PARTS.map(p => `<button class="chip-btn" data-act="createEx" data-p="${p}">${p}</button>`).join('')}</div></div>`;
  html += list.map(x => `<button class="pick ${added.has(x.id)?'added':''}" data-act="pick" data-id="${x.id}"><span>${esc(x.name)}</span>${chip(x.part)}</button>`).join('');
  $('#plist').innerHTML = html || '<p class="muted">沒有符合的動作，可直接輸入名稱新增</p>';
}
function pickEx(id){
  ui.picker.added.add(id);
  ui.picker.onPick(id);
  toast(`已加入：${exOf(id).name}`);
  renderPickerList();
}

/* 休息計時 */
function startRest(){
  const sec = num(S.settings.rest);
  if (sec > 0) { ui.rest = Date.now() + sec*1000; renderRest(); }
}
function renderRest(){
  const el = $('#rest');
  if (!ui.rest || ui.tab !== 'train') { el.hidden = true; return; }
  const left = Math.round((ui.rest - Date.now())/1000);
  if (left < -30) { ui.rest = null; el.hidden = true; return; }
  el.hidden = false;
  el.className = left <= 0 ? 'over' : '';
  const t = Math.abs(left);
  el.innerHTML = `<span>${left <= 0 ? '休息結束！' : '休息'} ${Math.floor(t/60)}:${pad(t%60)}</span>
    <button data-act="restAdd">+30s</button><button data-act="restSkip">略過</button>`;
}
setInterval(() => { if (ui.rest) renderRest(); }, 500);

/* toast */
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- 事件 ---------- */
const ACT = {
  tab: d => { ui.tab = d.t; window.scrollTo(0,0); render(); },
  start: d => {
    const w = {id:uid(), date:today(), start:Date.now(), entries:[], note:''};
    const r = S.routines.find(r => r.id === d.id);
    if (r) { w.routineId = r.id; w.entries = r.items.map(id => newEntry(id, w)); }
    S.workouts.push(w); S.active = w.id; save(); render();
    if (!r) ACT.addEx();
  },
  addEx: () => {
    const w = activeW();
    openPicker(id => { w.entries.push(newEntry(id, w)); save(); $('#view').innerHTML = viewTrain(); }, w.entries.map(e => e.exId));
  },
  addSet: d => {
    const e = activeW().entries[d.e], p = e.sets[e.sets.length-1];
    e.sets.push({w:p ? p.w : '', r:p ? p.r : '', done:false}); save(); render();
  },
  delSet: d => { activeW().entries[d.e].sets.splice(d.s, 1); save(); render(); },
  done: d => {
    const s = activeW().entries[d.e].sets[d.s];
    s.done = !s.done; save(); if (s.done) startRest(); render();
  },
  delEntry: d => {
    const w = activeW(), e = w.entries[d.e];
    if (e.sets.some(hasVal) && !confirm(`移除「${exOf(e.exId).name}」？`)) return;
    w.entries.splice(d.e, 1); save(); render();
  },
  upEntry: d => { const a = activeW().entries, i = +d.e; [a[i-1], a[i]] = [a[i], a[i-1]]; save(); render(); },
  finish: () => {
    const w = activeW();
    w.entries.forEach(e => e.sets = e.sets.filter(hasVal));
    w.entries = w.entries.filter(e => e.sets.length);
    if (!w.entries.length) { S.workouts = S.workouts.filter(x => x.id !== w.id); toast('沒有任何紀錄，已取消這次訓練'); }
    else toast(`完成！總量 ${Math.round(volumeOf(w)).toLocaleString()} kg 🎉`);
    S.active = null; ui.rest = null; save(); render();
  },
  discard: () => {
    if (!confirm('確定刪除這次訓練？')) return;
    S.workouts = S.workouts.filter(x => x.id !== S.active); S.active = null; ui.rest = null; save(); render();
  },
  restAdd: () => { ui.rest = Math.max(ui.rest, Date.now()) + 30000; renderRest(); },
  restSkip: () => { ui.rest = null; renderRest(); },
  // 菜單
  rNew: () => { ui.editRoutine = {id:null, name:'', items:[]}; render(); },
  rEdit: d => { const r = S.routines.find(r => r.id === d.id); ui.editRoutine = {...r, items:[...r.items]}; render(); },
  rAdd: () => openPicker(id => { if (!ui.editRoutine.items.includes(id)) ui.editRoutine.items.push(id); $('#view').innerHTML = viewRoutine(); }, ui.editRoutine.items),
  rUp: d => { const a = ui.editRoutine.items, i = +d.i; [a[i-1], a[i]] = [a[i], a[i-1]]; render(); },
  rDel: d => { ui.editRoutine.items.splice(d.i, 1); render(); },
  rSave: () => {
    const r = ui.editRoutine;
    if (!r.name.trim()) { toast('請輸入菜單名稱'); return; }
    if (r.id) Object.assign(S.routines.find(x => x.id === r.id), r);
    else S.routines.push({...r, id:uid()});
    ui.editRoutine = null; save(); render(); toast('已儲存菜單');
  },
  rRemove: () => {
    if (!confirm('刪除這個菜單？（過去的訓練紀錄不受影響）')) return;
    S.routines = S.routines.filter(x => x.id !== ui.editRoutine.id); ui.editRoutine = null; save(); render();
  },
  rCancel: () => { ui.editRoutine = null; render(); },
  // 紀錄
  hToggle: d => { ui.openHist = ui.openHist === d.id ? null : d.id; render(); },
  hEdit: d => {
    if (S.active && S.active !== d.id) { alert('目前有進行中的訓練，請先完成或刪除它。'); return; }
    S.active = d.id; ui.tab = 'train'; save(); render(); window.scrollTo(0,0);
  },
  hDel: d => { if (!confirm('刪除這筆訓練紀錄？')) return; S.workouts = S.workouts.filter(w => w.id !== d.id); save(); render(); },
  // 選擇器
  closePicker: () => { ui.picker = null; render(); },
  pPart: d => { ui.picker.part = d.p; renderModal(); },
  pick: d => pickEx(d.id),
  createEx: d => {
    const x = {id:uid(), name:ui.picker.q.trim(), part:d.p};
    S.exercises.push(x); save(); ui.picker.q = ''; ui.picker.part = d.p; renderModal(); pickEx(x.id);
  },
  // 設定
  addCustomEx: () => openPicker(() => { $('#view').innerHTML = viewSettings(); }),
  renameEx: d => {
    const x = S.exercises.find(x => x.id === d.id), n = prompt('新的名稱', x.name);
    if (n && n.trim()) { x.name = n.trim(); save(); render(); }
  },
  delEx: d => {
    const x = exOf(d.id);
    if (!confirm(`從動作庫刪除「${x.name}」？\n（舊紀錄會顯示為「已刪除的動作」，建議用改名代替）`)) return;
    S.exercises = S.exercises.filter(e => e.id !== d.id);
    S.routines.forEach(r => r.items = r.items.filter(i => i !== d.id));
    save(); render();
  },
  export: async () => {
    const name = `健身紀錄備份-${today()}.json`;
    const file = new File([JSON.stringify(S, null, 2)], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:name}); return; } catch(e){ if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  reset: () => {
    if (!confirm('確定清除所有資料？此動作無法復原，建議先匯出備份。')) return;
    if (!confirm('真的要清除嗎？')) return;
    S = seed(); ui.editRoutine = null; save(); render(); toast('已重置');
  }
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') { ui.picker = null; render(); return; }
  const t = e.target.closest('[data-act]');
  if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset, t, e);
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.f) { activeW().entries[d.e].sets[d.s][d.f] = t.value.replace(',', '.'); save(); return; }
  if (t.id === 'pq') { ui.picker.q = t.value; renderPickerList(); return; }
  switch (d.bind) {
    case 'note': activeW().note = t.value; save(); break;
    case 'rname': ui.editRoutine.name = t.value; break;
    case 'rest': S.settings.rest = t.value; save(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.bind === 'wdate' && t.value) { activeW().date = t.value; save(); render(); }
  if (d.bind === 'progressEx') { ui.progressEx = t.value; render(); }
  if (t.id === 'importFile' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(fr.result);
        if (!Array.isArray(data.exercises) || !Array.isArray(data.workouts)) throw 0;
        if (!confirm(`匯入 ${data.workouts.length} 筆訓練紀錄？目前手機上的資料會被取代。`)) return;
        data.routines ??= []; data.settings ??= {rest:90};
        S = data; save(); render(); toast('匯入成功');
      } catch(_) { alert('檔案格式不正確'); }
    };
    fr.readAsText(t.files[0]); t.value = '';
  }
});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js').catch(() => {});

render();
</script>
</body>
</html>
